
name: Build Alkolhana Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Locate Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found"
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Found sdkmanager at: $SDKMANAGER"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          "$SDKMANAGER" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack native Android project
        shell: bash
        run: |
          test -f alkolhana_android_source.zip || {
            echo "ERROR: Missing alkolhana_android_source.zip in repository root"
            exit 1
          }
          unzip -o alkolhana_android_source.zip -d .
          test -f alkolhana_android/app/build.gradle.kts || {
            echo "ERROR: Android project files were not found after extraction"
            exit 1
          }

      - name: Build debug APK
        run: gradle -p alkolhana_android --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: alkolhana-debug-apk
          path: alkolhana_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
