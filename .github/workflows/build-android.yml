
name: Build Alkolhana Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack native Android project
        run: |
          test -f alkolhana_android_source.zip || (echo 'Missing alkolhana_android_source.zip' && exit 1)
          unzip -o alkolhana_android_source.zip -d .
          test -f alkolhana_android/app/build.gradle.kts

      - name: Build debug APK
        run: gradle -p alkolhana_android --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: alkolhana-debug-apk
          path: alkolhana_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
