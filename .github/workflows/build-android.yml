name: Build ALO USTA Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check and unpack updated Android source
        shell: bash
        run: |
          test -f ALO_USTA_android_updated_source.zip || {
            echo "ERROR: ALO_USTA_android_updated_source.zip was not found in the repository root."
            exit 1
          }

          unzip -o ALO_USTA_android_updated_source.zip -d .

          test -f alkolhana_android/app/build.gradle.kts
          test -f alkolhana_android/app/google-services.json

      - name: Build debug APK
        run: gradle -p alkolhana_android --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALO-USTA-debug-apk
          path: alkolhana_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
